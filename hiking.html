<h1>เดินป่าครั้งแรก ต้องเตรียมอะไรบ้าง</h1>

<p>
การเดินป่าครั้งแรกไม่จำเป็นต้องยาก แต่ต้องเตรียมตัวให้พร้อม
</p>

<h2>สิ่งที่ควรเตรียม</h2>

<ul>
  <li>รองเท้าที่เหมาะกับการเดินป่า</li>
  <li>น้ำดื่มและอาหารแห้ง</li>
  <li>เสื้อผ้าที่แห้งง่าย</li>
  <li>ยาประจำตัว</li>
</ul>

<p>
การเตรียมตัวที่ดี ทำให้การเดินป่าปลอดภัยและสนุกขึ้นมาก
</p>
